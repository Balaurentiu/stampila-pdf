name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setează Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalează dependențe Python
        run: pip install flask PyMuPDF Pillow numpy pywebview pyinstaller

      - name: Convertește PNG la ICO
        run: |
          python -c "
          from PIL import Image
          img = Image.open('stamp_icon.png').convert('RGBA')
          img.save('stampila.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          print('ICO generat.')
          "

      - name: Compilează cu PyInstaller
        run: pyinstaller stampila.spec

      - name: Verifică iconiță în exe
        run: |
          python -c "
          import struct, os
          exe = 'dist/StampilaPDF/StampilaPDF.exe'
          size = os.path.getsize(exe)
          print(f'EXE size: {size} bytes')
          assert size > 500_000, 'EXE prea mic, ceva a mers prost'
          print('OK')
          "

      - name: Instalează Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Creează installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publică Release pe GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "PDF Ștampilă ${{ github.ref_name }}"
          files: installer-output/StampilaPDF-Setup-*.exe
          generate_release_notes: true
