name: Build Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setează Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalează dependențe Python
        run: pip install flask PyMuPDF Pillow numpy pywebview pyinstaller

      - name: Convertește PNG la ICO
        run: |
          python -c "
          from PIL import Image
          img = Image.open('stamp_icon.png').convert('RGBA')
          img.save('stampila.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          print('ICO generat.')
          "

      - name: Compilează cu PyInstaller
        run: pyinstaller stampila.spec

      - name: Instalează Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Creează installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publică Release Windows
        uses: softprops/action-gh-release@v2
        with:
          name: "PDF Ștampilă ${{ github.ref_name }}"
          files: installer-output/StampilaPDF-Setup-*.exe
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setează Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalează dependențe sistem (WebKit2GTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libgirepository1.0-dev gcc libcairo2-dev pkg-config

      - name: Instalează dependențe Python
        run: pip install flask PyMuPDF Pillow numpy pywebview pyinstaller PyGObject

      - name: Compilează cu PyInstaller
        run: pyinstaller stampila.spec

      - name: Creează script de instalare
        run: |
          cat > dist/StampilaPDF/install.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          INSTALL_DIR="/opt/StampilaPDF"
          DESKTOP_FILE="/usr/share/applications/stampila-pdf.desktop"
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          echo "=== Instalare PDF Ștampilă ==="

          # Verifică dependențe sistem
          echo "Verificare dependențe WebKit2GTK..."
          if ! dpkg -l | grep -q "libwebkit2gtk-4.0\|libwebkit2gtk-4.1"; then
            echo "Instalare dependențe (necesită sudo)..."
            sudo apt-get update -qq
            sudo apt-get install -y python3-gi python3-gi-cairo \
              gir1.2-gtk-3.0 gir1.2-webkit2-4.0 || \
            sudo apt-get install -y python3-gi python3-gi-cairo \
              gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          fi

          echo "Copiere fișiere în $INSTALL_DIR..."
          sudo mkdir -p "$INSTALL_DIR"
          sudo cp -r "$SCRIPT_DIR"/. "$INSTALL_DIR/"
          sudo chmod +x "$INSTALL_DIR/StampilaPDF"

          echo "Creare shortcut în meniul de aplicații..."
          sudo tee "$DESKTOP_FILE" > /dev/null << DESKTOP
          [Desktop Entry]
          Name=PDF Ștampilă
          Comment=Aplică ștampile pe documente PDF
          Exec=$INSTALL_DIR/StampilaPDF
          Icon=$INSTALL_DIR/stamp_icon.png
          Terminal=false
          Type=Application
          Categories=Office;
          DESKTOP

          echo ""
          echo "✅ Instalare completă!"
          echo "   Poți lansa aplicația din meniul de aplicații sau rulând:"
          echo "   $INSTALL_DIR/StampilaPDF"
          SCRIPT
          chmod +x dist/StampilaPDF/install.sh

      - name: Creează pachet tar.gz
        run: |
          VERSION="${{ github.ref_name }}"
          cd dist
          tar -czf StampilaPDF-Linux-${VERSION}.tar.gz StampilaPDF/
          echo "Pachet creat: StampilaPDF-Linux-${VERSION}.tar.gz"

      - name: Publică Release Linux
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StampilaPDF-Linux-*.tar.gz
